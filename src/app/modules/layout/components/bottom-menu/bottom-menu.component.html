<mat-toolbar class="bottom-menu">
	<div class="bottom-menu__content">
		<button mat-button
			class="bottom-menu__button"
			routerLinkActive="bottom-menu__button--active"
            [class.with-text]="settingsService.device() === EDisplayDevice.INFO_PANEL"
			[routerLink]="ERoute.PROGRAM"
            [queryParamsHandling]="'merge'"
		>
			<span class="bottom-menu__inner">
				<mat-icon>view_list</mat-icon>
				<span class="bottom-menu__label">{{ 'Program' | translate }}</span>
			</span>
        </button>

        <button mat-button
            routerLinkActive="bottom-menu__button--active"
            class="bottom-menu__button"
            [class.with-text]="settingsService.device() === EDisplayDevice.INFO_PANEL"
            [routerLink]="ERoute.MAP"
            [queryParamsHandling]="'merge'"
        >
			<span class="bottom-menu__inner">
				<mat-icon>place</mat-icon>
				<span class="bottom-menu__label">{{ 'Mapa' | translate }}</span>
			</span>
        </button>

		<button mat-button
			routerLinkActive="bottom-menu__button--active"
			class="bottom-menu__button"
            [class.with-text]="settingsService.device() === EDisplayDevice.INFO_PANEL"
			[routerLink]="ERoute.NOTIFICATIONS"
            [queryParamsHandling]="'merge'"
		>
			<span class="bottom-menu__inner">
				<mat-icon>notifications</mat-icon>
				<span class="bottom-menu__label">{{ 'Notifikace' | translate }}</span>
			</span>
		</button>

		@if (showConfigurableButton) {
			<button mat-button
				class="bottom-menu__button"
				[class.with-text]="settingsService.device() === EDisplayDevice.INFO_PANEL"
				(click)="openConfigurableButton()"
			>
				<span class="bottom-menu__inner">
					<mat-icon>{{ configurableButtonIcon }}</mat-icon>
					<span class="bottom-menu__label">{{ configurableButtonLabel }}</span>
				</span>
			</button>
		}
	</div>
</mat-toolbar>
