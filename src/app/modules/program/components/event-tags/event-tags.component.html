<mat-chip-set>
@for(tag of event().tags; track tag.id) {
    <mat-chip>
        <mat-icon matChipAvatar>tag</mat-icon>
        @if(translate.currentLang === 'cs') {
            {{ tag.nameCs ?? tag.nameEn }}
        } @else {
            {{ tag.nameEn ?? tag.nameCs }}
        }
    </mat-chip>
}
</mat-chip-set>
