<mat-tab-group class="full-height">
    @if (festivalMap) {
        <mat-tab [label]="'Hlavní' | translate">
            <ng-template matTabContent>
                <pinch-zoom style="height: 100%">
                    <div class="img-wrapper">
                        <img [src]="festivalMap" alt="Festival map">
                    </div>
                </pinch-zoom>
            </ng-template>
        </mat-tab>
    }

    @if (competitionsInfo) {
        <mat-tab [label]="'Soutěže' | translate">
            <ng-template matTabContent>
                <mat-tab-group class="sub-tabs">
                    @if (competitionMap) {
                        <mat-tab [label]="'Mapa' | translate">
                            <ng-template matTabContent>
                                <pinch-zoom style="height: 100%">
                                    <div class="img-wrapper">
                                        <img [src]="competitionMap" alt="Competition map">
                                    </div>
                                </pinch-zoom>
                            </ng-template>
                        </mat-tab>
                    }

                    <mat-tab [label]="'Otevírací doba' | translate">
                        <ng-template matTabContent>
                            <app-competitions-info [data]="competitionsInfo!"/>
                        </ng-template>
                    </mat-tab>
                </mat-tab-group>
            </ng-template>
        </mat-tab>
    }

    @if (tribesInfo) {
        <mat-tab [label]="'Atrakce&kmeny' | translate">
            <ng-template matTabContent>
                <mat-tab-group class="sub-tabs">
                    @if (tribesMap) {
                        <mat-tab [label]="'Mapa' | translate">
                            <ng-template matTabContent>
                                <pinch-zoom style="height: 100%">
                                    <div class="img-wrapper">
                                        <img [src]="tribesMap" alt="Tribes map">
                                    </div>
                                </pinch-zoom>
                            </ng-template>
                        </mat-tab>
                    }

                    <mat-tab [label]="'Otevírací doba' | translate">
                        <ng-template matTabContent>
                            <app-tribes-info [data]="tribesInfo!"/>
                        </ng-template>
                    </mat-tab>
                </mat-tab-group>
            </ng-template>
        </mat-tab>
    }
</mat-tab-group>
